name: Verify Sarin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A new PR revision may cancel tests; a production release must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  quality:
    name: Types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: node --test pages-gateway/tests/*.test.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm run build
      - run: pnpm run build:landing
      - run: pnpm run check:landing
      - run: pnpm run build:pages

  emulators:
    name: Firebase rules and local journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:rules
      - name: Run the complete local journey
        shell: bash
        run: |
          # Running a package script supplies npm_execpath from the real pnpm
          # CLI, rather than assuming command -v pnpm is a JavaScript file.
          # A dedicated process group delivers SIGTERM to the Node launcher,
          # which also stops the detached emulator and Next process groups.
          setsid pnpm run dev:local --port 3040 > "$RUNNER_TEMP/sarin-local.log" 2>&1 &
          sarin_test_pid=$!
          cleanup_sarin() {
            kill -TERM -- "-$sarin_test_pid" 2>/dev/null || true
            for attempt in {1..50}; do
              kill -0 -- "-$sarin_test_pid" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL -- "-$sarin_test_pid" 2>/dev/null || true
            wait "$sarin_test_pid" 2>/dev/null || true
          }
          trap cleanup_sarin EXIT
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 180000;
          let ready = false;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3040/api/session', {signal: AbortSignal.timeout(2500)});
              await response.arrayBuffer();
              if (response.status === 401) { ready = true; break; }
            } catch { /* Emulators and Next are still starting. */ }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('The isolated local application did not become ready.');
          NODE
          pnpm run test:local --port 3040
          pnpm run test:journey --port 3040

  cloudflare:
    name: Cloudflare configuration dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sarin-cloudflare-host --fail-if-no-match run check

  deploy:
    name: Deploy Cloudflare production
    needs: [quality, emulators, cloudflare]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: production
      url: https://sarinbotsaas.pages.dev
    concurrency:
      group: sarin-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # build:pages also builds and validates the static landing output.
      - run: pnpm run build:pages
      - name: Publish and verify Worker, Container and Pages
        run: node cloudflare/scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
